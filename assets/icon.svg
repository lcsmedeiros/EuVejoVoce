<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- fundo tatico full-bleed -->
  <rect width="1024" height="1024" fill="#0B0F0C"/>
  <rect x="40" y="40" width="944" height="944" rx="56" fill="#0E1411"/>

  <!-- moldura -->
  <rect x="72" y="72" width="880" height="880" rx="44" fill="none" stroke="#1F3D2B" stroke-width="10"/>

  <!-- grade sutil -->
  <g stroke="#15281C" stroke-width="2">
    <line x1="72" y1="306" x2="952" y2="306"/>
    <line x1="72" y1="718" x2="952" y2="718"/>
    <line x1="306" y1="72" x2="306" y2="952"/>
    <line x1="718" y1="72" x2="718" y2="952"/>
  </g>

  <!-- aneis de radar -->
  <circle cx="512" cy="512" r="372" fill="none" stroke="#1F3D2B" stroke-width="8"/>
  <circle cx="512" cy="512" r="288" fill="none" stroke="#00FF66" stroke-width="3" stroke-dasharray="6 12" opacity="0.7"/>
  <circle cx="512" cy="512" r="196" fill="none" stroke="#1F3D2B" stroke-width="4"/>

  <!-- marcas de grau ao redor -->
  <g stroke="#00FF66" stroke-width="5">
    <line x1="512" y1="116" x2="512" y2="152" transform="rotate(0 512 512)"/>
    <line x1="512" y1="116" x2="512" y2="152" transform="rotate(30 512 512)"/>
    <line x1="512" y1="116" x2="512" y2="152" transform="rotate(60 512 512)"/>
    <line x1="512" y1="116" x2="512" y2="152" transform="rotate(90 512 512)"/>
    <line x1="512" y1="116" x2="512" y2="152" transform="rotate(120 512 512)"/>
    <line x1="512" y1="116" x2="512" y2="152" transform="rotate(150 512 512)"/>
    <line x1="512" y1="116" x2="512" y2="152" transform="rotate(180 512 512)"/>
    <line x1="512" y1="116" x2="512" y2="152" transform="rotate(210 512 512)"/>
    <line x1="512" y1="116" x2="512" y2="152" transform="rotate(240 512 512)"/>
    <line x1="512" y1="116" x2="512" y2="152" transform="rotate(270 512 512)"/>
    <line x1="512" y1="116" x2="512" y2="152" transform="rotate(300 512 512)"/>
    <line x1="512" y1="116" x2="512" y2="152" transform="rotate(330 512 512)"/>
  </g>

  <!-- crosshair com folga no centro -->
  <g stroke="#00FF66" stroke-width="8" stroke-linecap="round">
    <line x1="512" y1="150" x2="512" y2="430"/>
    <line x1="512" y1="594" x2="512" y2="874"/>
    <line x1="150" y1="512" x2="402" y2="512"/>
    <line x1="622" y1="512" x2="874" y2="512"/>
  </g>

  <!-- olho central (Eu Vejo Voce) -->
  <path d="M 392 512 Q 512 416 632 512 Q 512 608 392 512 Z" fill="#0B0F0C" stroke="#00FF66" stroke-width="10"/>
  <circle cx="512" cy="512" r="52" fill="#00FF66"/>
  <circle cx="512" cy="512" r="22" fill="#0B0F0C"/>
  <circle cx="530" cy="494" r="9" fill="#0B0F0C" opacity="0.6"/>

  <!-- brackets de alvo nos cantos -->
  <g fill="none" stroke="#00FF66" stroke-width="9" stroke-linecap="square">
    <polyline points="176,256 176,176 256,176"/>
    <polyline points="848,256 848,176 768,176"/>
    <polyline points="176,768 176,848 256,848"/>
    <polyline points="848,768 848,848 768,848"/>
  </g>
</svg>
