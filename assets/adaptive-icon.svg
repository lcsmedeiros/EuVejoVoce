<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- foreground transparente; bg fica no app.json (Android recorta em circulo/squircle) -->
  <g transform="translate(512 512) scale(0.72) translate(-512 -512)">
    <!-- aneis de radar -->
    <circle cx="512" cy="512" r="372" fill="none" stroke="#1F3D2B" stroke-width="10"/>
    <circle cx="512" cy="512" r="288" fill="none" stroke="#00FF66" stroke-width="4" stroke-dasharray="6 12" opacity="0.7"/>
    <circle cx="512" cy="512" r="196" fill="none" stroke="#1F3D2B" stroke-width="5"/>

    <!-- marcas de grau -->
    <g stroke="#00FF66" stroke-width="7">
      <line x1="512" y1="116" x2="512" y2="152" transform="rotate(0 512 512)"/>
      <line x1="512" y1="116" x2="512" y2="152" transform="rotate(30 512 512)"/>
      <line x1="512" y1="116" x2="512" y2="152" transform="rotate(60 512 512)"/>
      <line x1="512" y1="116" x2="512" y2="152" transform="rotate(90 512 512)"/>
      <line x1="512" y1="116" x2="512" y2="152" transform="rotate(120 512 512)"/>
      <line x1="512" y1="116" x2="512" y2="152" transform="rotate(150 512 512)"/>
      <line x1="512" y1="116" x2="512" y2="152" transform="rotate(180 512 512)"/>
      <line x1="512" y1="116" x2="512" y2="152" transform="rotate(210 512 512)"/>
      <line x1="512" y1="116" x2="512" y2="152" transform="rotate(240 512 512)"/>
      <line x1="512" y1="116" x2="512" y2="152" transform="rotate(270 512 512)"/>
      <line x1="512" y1="116" x2="512" y2="152" transform="rotate(300 512 512)"/>
      <line x1="512" y1="116" x2="512" y2="152" transform="rotate(330 512 512)"/>
    </g>

    <!-- crosshair -->
    <g stroke="#00FF66" stroke-width="11" stroke-linecap="round">
      <line x1="512" y1="150" x2="512" y2="430"/>
      <line x1="512" y1="594" x2="512" y2="874"/>
      <line x1="150" y1="512" x2="402" y2="512"/>
      <line x1="622" y1="512" x2="874" y2="512"/>
    </g>

    <!-- olho central -->
    <path d="M 392 512 Q 512 416 632 512 Q 512 608 392 512 Z" fill="#0B0F0C" stroke="#00FF66" stroke-width="13"/>
    <circle cx="512" cy="512" r="52" fill="#00FF66"/>
    <circle cx="512" cy="512" r="22" fill="#0B0F0C"/>
    <circle cx="530" cy="494" r="9" fill="#0B0F0C" opacity="0.6"/>
  </g>
</svg>
